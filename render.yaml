services:
  - type: web
    name: filo-api
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: node src/server.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: filo-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: UPLOAD_PATH
        value: ./uploads
    disk:
      name: uploads
      mountPath: /uploads
      sizeGB: 1

databases:
  - name: filo-db
    plan: free
    databaseName: filo_yonetim
    user: filo
